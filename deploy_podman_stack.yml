---
# deploy_podman_stack.yml

- name: Deploy web stack with Podman (Nginx -> Flask -> MySQL)
  hosts: localhost
  gather_facts: false 
  become: true
  vars:

    # Paths on the target host where build contexts exist (you can rsync/copy them beforehand)
    src_base_dir: "/opt/deploy/shipping-containers"          # expected to contain nginx/, flask/, mysql/
    # nginx_ctx: "{{ src_base_dir }}/nginx"
    flask_ctx: "{{ src_base_dir }}"
    # mysql_ctx: "{{ src_base_dir }}/mysql"

   
    # Podman network & volumes
    podman_network: "webnet"
    # mysql_volume: "shipping_containers_data"

    # Ports
    # nginx_host_port: 80
    # nginx_container_port: 80
    flask_container_port: 5000

    # MySQL env (change password in production!)
    mysql_root_password: "ChangeMeRootPass!"
    mysql_database: "appdb"
    mysql_user: "appuser"
    mysql_password: "ChangeMeAppPass!"

    # Systemd unit directory
    # systemd_unit_dir: "/etc/systemd/system"
    # Container extra run args (list)
    flask_env:
      - "DATABASE_HOST={{ mysql_ct }}"
      - "DATABASE_USER={{ mysql_user }}"
      - "DATABASE_PASSWORD={{ mysql_password }}"
      - "DATABASE_NAME={{ mysql_database }}"

  tasks:
  - name: Install Podman and its dependencies
    ansible.builtin.package:
      name:
        - podman
        - buildah
      state: present

  - name: Ensure package manager cache is up to date (dnf)
    dnf:
      update_cache: yes
    when: pkg_mgr == "dnf"

  - name: Ensure /opt/deploy exists
    file:
      path: "{{ src_base_dir }}"
      state: directory
      owner: root
      group: root
      mode: "0755"

  # - name: Create named podman volume for MySQL
  #   command: podman volume inspect {{ mysql_volume }}
  #   register: vol_inspect
  #   ignore_errors: yes

  # - name: Create volume if missing
  #   command: podman volume create {{ mysql_volume }}
  #   when: vol_inspect.rc != 0


  - name: Build Flask image
    containers.podman.podman_image:
        name: flask-app-image
        build:
          path: "{{ flask_ctx }}"
          filepath: Containerfile
          state: build

      
  - name: Run container
    containers.podman.podman_container:
        name: flask-app-container
        ports:
          - "5000:5000"
        state: started
        detach: true
        restart_policy: always
   

  # - name: Pause briefly for containers to settle
