---
# deploy_podman_stack.yml

- name: Deploy web stack with Podman (Nginx -> Flask -> MySQL)
  hosts: webserver
  gather_facts: true
  become: true

  vars_files:
    - "db-vault"
  vars:


    src_base_dir: "/home/borysyy/shipping-containers"
    flask_ctx: "{{ src_base_dir }}"
    mysql_ctx: "{{ src_base_dir }}/mysql"
    nginx_ctx: "{{ src_base_dir }}/nginx"

    remote_flask_app_dir: "/home/webmaster/shipping-containers/"
    remote_mysql_app_dir: "/home/webmaster/shipping-containers/mysql"
    remote_nginx_app_dir: "/home/webmaster/shipping-containers/nginx"


    # Podman network & volumes
    podman_network: "shipping_containers_network"
    mysql_volume: "shipping_containers_data"

    # Systemd unit directory
    # systemd_unit_dir: "/etc/systemd/system"
    # Container extra run args (list)

  tasks:
  - name: Install Podman and its dependencies
    ansible.builtin.package:
      name:
        - podman
        - buildah
      state: present

  - name: Ensure all build contexts exist
    file:
      path: "{{ item }}"
      state: directory
    loop:
      - "{{ remote_flask_app_dir }}"
      - "{{ remote_mysql_app_dir }}"
      - "{{ remote_nginx_app_dir }}"

  - name: Copy Containerfiles to remote host
    copy:
      src: "{{ item.src }}"
      dest: "{{ item.dest }}"
      owner: webmaster
      group: webmaster
      mode: "0644"
    loop:
      - { src: "{{ flask_ctx }}/Containerfile", dest: "{{ remote_flask_app_dir }}/Containerfile" }
      - { src: "{{ flask_ctx }}/requirements.txt", dest: "{{ remote_flask_app_dir }}/requirements.txt" }
      - { src: "{{ flask_ctx }}/flask_project/", dest: "{{ remote_flask_app_dir }}/flask_project/" }
      - { src: "{{ mysql_ctx }}/", dest: "{{ remote_mysql_app_dir }}/" }
      - { src: "{{ nginx_ctx }}/", dest: "{{ remote_nginx_app_dir }}/" }

  - name: Ensure user systemd dir exists
    file:
      path: /home/webmaster/.config/systemd/user
      state: directory
      mode: "0755"
    become: true
    become_user: webmaster



  - name: Create podman network
    containers.podman.podman_network:
        name: "{{ podman_network }}"
        state: present

  - name: Build mySQL image
    containers.podman.podman_image:
        name: mysql-image:1.0
        state: build
        path: "{{ remote_mysql_app_dir }}"
    

  - name: Create mySQL container
    containers.podman.podman_container:
        image: mysql-image:1.0
        name: mysql-shipping-containers
        ports:
          - "3306:3306"
        env:
          MYSQL_ROOT_PASSWORD: "{{ MYSQL_ROOT_PASSWORD }}"
          MYSQL_DATABASE: "{{ MYSQL_DATABASE }}"
          MYSQL_USER: "{{ MYSQL_USER }}"
          MYSQL_PASSWORD: "{{ MYSQL_PASSWORD }}"
        volumes:
          - "{{ mysql_volume }}:/var/lib/mysql"
        network:
          - "{{ podman_network }}"
        detach: true
        rm: true
        state: created
    
  - name: Generate systemd unit file for MySQL container
    containers.podman.podman_generate_systemd:
      name: mysql-shipping-containers
      new: true
      no_header: true
      dest: /home/webmaster/.config/systemd/user/

  - name: Ensure mySQL container is started and enabled
    ansible.builtin.systemd:
      name: container-mysql-shipping-containers
      daemon_reload: true
      enabled: true
      state: started

  - name: Wait for MySQL port to be available
    wait_for:
      host: "127.0.0.1"
      port: 3306
      delay: 5
      timeout: 60

  - name: Create and start webserver pod
    containers.podman.podman_pod:
        name: webserver-pod
        state: started
        hostname: webserver-pod
        ports:
          - "80:80"
          - "5000:5000"
        network: 
          - "{{ podman_network }}"

  - name: Build Flask image
    containers.podman.podman_image:
        name: flask-app-image:1.0
        state: build
        path: "{{ remote_flask_app_dir }}"
        force: true
        build:
          cache: false
  
  - name: Run Flask container
    containers.podman.podman_container:
        image: flask-app-image:1.0
        name: flask-app-shipping-containers
        env:
          MYSQL_DATABASE: "{{ MYSQL_DATABASE }}"
          MYSQL_USER: "{{ MYSQL_USER }}"
          MYSQL_PASSWORD: "{{ MYSQL_PASSWORD }}"
          DB_HOST: "mysql-container"
          DB_PORT: "3306"
        state: started
        detach: true
        restart_policy: always
        pod: webserver-pod

  - name: Build Nginx image
    containers.podman.podman_image:
        name: nginx-app-image:1.0
        state: build
        path: "{{ remote_nginx_app_dir}}"
        force: true
        build:
          cache: false
   
  - name: Run Nginx container
    containers.podman.podman_container:
        image: nginx-app-image:1.0
        name: nginx-app-shipping-containers
        state: started
        detach: true
        restart_policy: always
        pod: webserver-pod

  - name: Reload user systemd
    command: systemctl --user daemon-reload
    become: true
    become_user: webmaster


  - name: Prune dangling images
    containers.podman.podman_prune:
      image: true
   

 
